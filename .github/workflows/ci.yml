name: CI
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MBOARIDE_TEST_PG: "host=localhost port=5432 user=postgres password=postgres dbname=postgres"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest
  agents:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: agents } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - run: pytest
  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/mboaride_flutter_project } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - run: flutter pub get
      # Les infos de dépréciation de package:flutter/material.dart viennent de la
      # version de Flutter, pas du code : la chaîne échoue sur les avertissements
      # et les erreurs, pas sur elles.
      - run: flutter analyze lib --no-fatal-infos
      - run: flutter test
  api-node:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: "backend/mboaride-api-node(1)" } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: npm ci --no-audit --fund=false
      - run: npm test
